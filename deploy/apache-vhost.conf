# =====================================================================
# Debia Smart Inventory — sitio de Apache para Lightsail (Ubuntu).
#
# Copiar a /etc/apache2/sites-available/debia-smart-inventory.conf,
# reemplazar inventario.ejemplo.com por el dominio real y luego:
#     sudo a2ensite debia-smart-inventory && sudo a2dissite 000-default
#     sudo systemctl reload apache2
#     sudo certbot --apache -d inventario.ejemplo.com
# Certbot crea la versión HTTPS (:443) de este sitio y la redirección
# de HTTP a HTTPS automáticamente.
# =====================================================================

<VirtualHost *:80>
    ServerName inventario.ejemplo.com

    # Solo la carpeta public/ es visible desde internet. app/, bin/,
    # database/, .env y .git quedan fuera del DocumentRoot.
    DocumentRoot /var/www/debia-smart-inventory/public

    <Directory /var/www/debia-smart-inventory>
        Require all denied
        AllowOverride None
    </Directory>

    <Directory /var/www/debia-smart-inventory/public>
        # Solo los métodos que usa la app (PUT, DELETE, OPTIONS... se rechazan).
        Require method GET POST HEAD
        Options -Indexes -MultiViews
        DirectoryIndex index.php
        AllowOverride None
    </Directory>

    # Archivos ocultos (.htaccess, .env, .git...) nunca se sirven.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Las credenciales se leen del archivo .env (ver .env.example).
    # Alternativa: definirlas aquí con SetEnv (tienen prioridad), p. ej.:
    #   SetEnv APP_ENV production

    ErrorLog ${APACHE_LOG_DIR}/debia-smart-inventory-error.log
    CustomLog ${APACHE_LOG_DIR}/debia-smart-inventory-access.log combined
</VirtualHost>
